<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3b37">
<title>كاشير المتميز</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--sf:#fff;--ink:#0c2f2c;--mu:#5f7774;--ln:#d9e4e1;--pr:#0f5c55;--on:#fff;--bar:#0c3b37;--ac:#e3a008;--rd:#c93c3c;--gr:#14804a;--soft:#e4eeec}
@media(prefers-color-scheme:dark){:root{--bg:#0a1514;--sf:#12231f;--ink:#e7f1ef;--mu:#8fa8a4;--ln:#23403c;--pr:#3cc4b3;--on:#05211e;--bar:#163732;--rd:#f07676;--gr:#4cd08a;--soft:#1a312d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:720px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--bar);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:22px}
.today{text-align:left;font-size:12px;color:var(--mu);line-height:1.3}.today b{display:block;font-size:17px;color:var(--gr)}
main{max-width:720px;margin:auto;padding:8px 14px 190px}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:18px 4px 8px}
.srch{display:flex;gap:8px;position:relative}
.srch input{flex:1;height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);padding:0 44px 0 14px;font-size:17px}
.srch>svg{position:absolute;right:14px;top:15px;width:22px;height:22px;stroke:var(--mu);fill:none;stroke-width:2;stroke-linecap:round}
.srch input:focus{border-color:var(--pr);outline:none}
.camb{width:52px;height:52px;border-radius:14px;border:0;background:var(--pr);color:var(--on);display:grid;place-items:center}
.camb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hit{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:6px;border-inline-start:4px solid var(--ac)}
.hit small{color:var(--mu);display:block}
.rc{background:var(--sf);border-radius:16px;margin-top:14px;padding:6px 14px;position:relative;box-shadow:0 1px 0 var(--ln)}
.rc:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px -1px,transparent 6px,var(--sf) 6.5px) 0 0/12px 8px repeat-x}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--ln)}
.line:last-child{border:0}
.line .nm{flex:1;min-width:0}.line .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line .nm small{color:var(--mu)}
.stp{display:flex;align-items:center;background:var(--soft);border-radius:10px}
.stp button{width:36px;height:36px;border:0;background:none;font-size:20px;font-weight:700;color:var(--pr)}
.stp span{min-width:26px;text-align:center;font-weight:700}
.empty{padding:34px 10px;text-align:center;color:var(--mu)}
.empty svg{width:46px;height:46px;stroke:var(--ln);fill:none;stroke-width:1.6;margin-bottom:6px}
#pb{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:8;padding:0 10px;display:none}
#pb .in{max-width:700px;margin:auto;background:var(--bar);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #0005}
#pb .tt{flex:1}#pb .tt small{opacity:.7;display:block;font-size:12px}#pb .tt b{font-size:26px;line-height:1.1}
.btn{border:0;border-radius:12px;padding:0 16px;height:46px;font-weight:600;background:var(--pr);color:var(--on)}
.btn.ac{background:var(--ac);color:#2b1d00}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.rd{background:var(--rd);color:#fff}.btn.sm{height:38px;padding:0 12px;font-size:14px}.btn.w{width:100%}
#pb .btn{height:48px}#pb .btn.dbt{background:#ffffff1f;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);height:64px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pr);font-weight:700}nav button.on svg{stroke-width:2.4}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.sb{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.g{color:var(--gr)}.l{color:var(--rd)}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pl span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12.5px}
.hero{background:var(--bar);color:#fff;border-radius:18px;padding:18px;margin-top:8px}
.hero small{opacity:.75}.hero b{display:block;font-size:38px;line-height:1.15}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.kg .card{margin:0}.kg b{font-size:21px;display:block}
label{display:block;font-size:13px;color:var(--mu);margin:10px 2px 4px}
input,select{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);padding:0 12px}
input:focus,select:focus{border-color:var(--pr);outline:none}
#sh{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}
#sb{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--ln);margin:6px auto 12px}
#sb h3{margin:0 0 4px;font-size:18px}
video{width:100%;height:42vh;max-height:340px;object-fit:cover;border-radius:16px;background:#000;display:block}
.vw{position:relative}.vw:after{content:"";position:absolute;inset:14% 14%;border:2px dashed #fff9;border-radius:18px;pointer-events:none}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.chip{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;background:var(--soft);border:0;border-radius:12px;padding:12px 14px;margin-top:6px}
.chip em{font-style:normal;font-size:12px;color:var(--mu)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;transition:transform .25s;font-weight:600;max-width:90%}
#toast.on{transform:translate(-50%,0)}
kbd{background:var(--soft);border-radius:5px;padding:1px 6px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){#pb .tt b{font-size:22px}.btn{padding:0 12px}}
</style></head><body>
<header><div class="brand"><div class="logo">م</div>كاشير المتميز</div><div class="today">مبيعات اليوم<b class="num" id="td">0</b></div></header>
<main id="m"></main>
<div id="pb"></div>
<nav id="nv"></nav>
<div id="sh" onclick="if(event.target==this)closeSheet()"><div id="sb"></div></div>
<div id="toast"></div>
<canvas id="cv" width="16" height="16" hidden></canvas><canvas id="c8" width="8" height="8" hidden></canvas>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={products:[],sales:[],exp:[],debts:[],capital:0};
try{const x=localStorage.getItem('kasher_mutamayez');if(x)D=Object.assign(D,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('kasher_mutamayez',JSON.stringify(D))}catch(e){toast('تعذر الحفظ في المتصفح')}};
const n2=n=>(Math.round(n*100)/100).toLocaleString('en');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const find=id=>D.products.find(p=>p.id==id);
let tab='pos',cart=[],q='',stream=null,loop=null,frames=[];
const I={
 pos:'<path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
 prod:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
 rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 debt:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/>',
 exp:'<path d="M3 11 12 4l9 7M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'};
const TABS={pos:'الكاشير',prod:'المنتجات',rep:'الأرباح',debt:'الديون',exp:'المصاريف'};
const ic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const camIc='<svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function sheet(h){$('#sb').innerHTML='<div class="grab"></div>'+h;$('#sh').classList.add('on')}
function closeSheet(){stopCam();$('#sh').classList.remove('on')}
function ask(title,label,def,cb,type='number'){sheet(`<h3>${title}</h3><label>${label}</label><input id="av" type="${type}" inputmode="${type=='number'?'decimal':'text'}" value="${esc(def??'')}"><div class="row" style="margin-top:14px"><button class="btn w" id="ok">حفظ</button><button class="btn ghost w" onclick="closeSheet()">إلغاء</button></div>`);
 const i=$('#av');i.focus();i.select&&i.select();const go=()=>{const v=i.value.trim();if(!v)return;closeSheet();cb(type=='number'?+v:v)};$('#ok').onclick=go;i.onkeydown=e=>{if(e.key=='Enter')go()}}
function render(){
 $('#nv').innerHTML=Object.keys(TABS).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${ic(k)}${TABS[k]}</button>`).join('');
 ({pos,prod,rep,debt,exp})[tab]();bar();head()}
function head(){const t=new Date().toDateString();$('#td').textContent=n2(D.sales.filter(s=>new Date(s.t).toDateString()==t).reduce((a,s)=>a+s.total,0))}
const cartTotal=()=>cart.reduce((s,c)=>s+(find(c.id)?.price||0)*c.q,0);
/* ===== الكاشير ===== */
function pos(){
 $('#m').innerHTML=`<div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="s" placeholder="ابحث باسم المنتج" autocomplete="off" value="${esc(q)}" oninput="q=this.value;hits()" onkeydown="if(event.key=='Enter'&&hit0())add(hit0().id)"><button class="camb" onclick="openScan()" aria-label="تعرّف بالكاميرا">${camIc}</button></div>
 <div id="hits"></div><div class="rc" id="cart"></div>
 <p class="mu" style="text-align:center;margin-top:26px"><kbd>F2</kbd> بحث <kbd>F4</kbd> كاميرا <kbd>Enter</kbd> إضافة <kbd>F9</kbd> كاش <kbd>F8</kbd> دين</p>`;
 hits();cartView()}
const hit0=()=>q?D.products.find(p=>p.name.includes(q)):null;
function hits(){const r=q?D.products.filter(p=>p.name.includes(q)).slice(0,6):[];
 $('#hits').innerHTML=r.map(p=>`<button class="hit" onclick="add('${p.id}')"><span><b>${esc(p.name)}</b><small>المتوفر ${p.qty}</small></span><b class="num">${n2(p.price)}</b></button>`).join('')||(q?'<div class="mu" style="margin:10px 4px">ما لقينا منتج بهذا الاسم</div>':'')}
function cartView(){$('#cart').innerHTML=cart.length?cart.map(c=>{const p=find(c.id);return`<div class="line"><div class="nm"><b>${esc(p.name)}</b><small class="num">${n2(p.price)} × ${c.q}${c.q>p.qty?' · أكثر من المخزون':''}</small></div><div class="stp"><button onclick="qty('${c.id}',-1)" aria-label="إنقاص">−</button><span class="num">${c.q}</span><button onclick="qty('${c.id}',1)" aria-label="زيادة">+</button></div><b class="num" style="min-width:56px;text-align:left">${n2(p.price*c.q)}</b></div>`}).join(''):`<div class="empty"><svg viewBox="0 0 24 24">${I.pos}</svg><div>السلة فاضية<br>ابحث عن منتج أو وجّه الكاميرا عليه</div></div>`}
function bar(){const b=$('#pb');if(tab!='pos'||!cart.length){b.style.display='none';return}
 b.style.display='block';b.innerHTML=`<div class="in"><div class="tt"><small>الإجمالي · ${cart.reduce((s,c)=>s+c.q,0)} قطعة</small><b class="num">${n2(cartTotal())}</b></div><button class="btn dbt" onclick="pay(1)">دين</button><button class="btn ac" onclick="pay(0)">كاش</button><button class="btn dbt" onclick="cart=[];render()" aria-label="مسح السلة" style="padding:0 12px">✕</button></div>`}
function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});q='';toast('أضيف: '+find(id).name);if($('#sh').classList.contains('on')&&$('#vd')){stopLoop();cartRefresh();return}closeSheet();tab='pos';render()}
function cartRefresh(){if(tab=='pos'){cartView();bar()}else bar();startLoop()}
function qty(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<=0)cart=cart.filter(x=>x!=c);cartView();bar()}
function pay(debt){if(!cart.length)return;if(debt)ask('بيع بالدين','اسم المدين','',n=>fin(1,n),'text');else fin(0)}
function fin(debt,name){const items=cart.map(c=>{const p=find(c.id);p.qty-=c.q;return{id:p.id,name:p.name,q:c.q,p:p.price,c:p.cost}});
 const total=items.reduce((s,i)=>s+i.p*i.q,0);
 D.sales.push({t:Date.now(),items,total,cost:items.reduce((s,i)=>s+i.c*i.q,0),debt:!!debt});
 if(debt)D.debts.push({id:uid(),name,amt:total,t:Date.now(),paid:0});
 cart=[];save();toast((debt?'سُجّل دين ':'تم البيع ')+n2(total));render()}
/* ===== المنتجات ===== */
function prod(){
 $('#m').innerHTML=`<button class="btn w" style="margin-top:8px;height:52px" onclick="openAdd()">+ إضافة منتج بالكاميرا</button>
 ${D.products.map(p=>`<div class="card"><div class="row sb"><b>${esc(p.name)}</b><span class="mu" style="flex:none">${p.sigs.length} لقطة</span></div>
 <div class="pl"><span>السعر <b class="num">${n2(p.price)}</b></span><span>رأس المال <b class="num">${n2(p.cost)}</b></span><span>الكمية <b class="num ${p.qty<=2?'l':''}">${p.qty}</b></span><span class="g">ربح الحبة <b class="num">${n2(p.price-p.cost)}</b></span></div>
 <div class="row" style="margin-top:10px"><button class="btn ghost sm" onclick="openAdd('${p.id}')">تعديل</button><button class="btn ghost sm" onclick="ask('إضافة مخزون','كم حبة وصلت؟','',v=>{find('${p.id}').qty+=v;save();render()})">+ مخزون</button><button class="btn ghost sm l" onclick="del('${p.id}')">حذف</button></div></div>`).join('')||`<div class="empty"><svg viewBox="0 0 24 24">${I.prod}</svg><div>ما سجلت أي منتج<br>اضغط «إضافة منتج» وصوّره بالكاميرا</div></div>`}
function del(id){const p=find(id);sheet(`<h3>حذف «${esc(p.name)}»؟</h3><p class="mu">ما يتأثر سجل المبيعات القديم.</p><div class="row"><button class="btn rd w" id="dy">حذف</button><button class="btn ghost w" onclick="closeSheet()">إلغاء</button></div>`);$('#dy').onclick=()=>{D.products=D.products.filter(x=>x.id!=id);save();closeSheet();render()}}
/* ===== الكاميرا والتعرف (على الجهاز، بدون إنترنت) ===== */
function sig(v){const w=v.videoWidth,h=v.videoHeight,s=Math.min(w,h)*.7,x=(w-s)/2,y=(h-s)/2;
 const c=$('#cv').getContext('2d',{willReadFrequently:true});c.drawImage(v,x,y,s,s,0,0,16,16);
 const d=c.getImageData(0,0,16,16).data,H=new Array(64).fill(0);
 for(let i=0;i<d.length;i+=4)H[(d[i]>>6)*16+(d[i+1]>>6)*4+(d[i+2]>>6)]+=1/256;
 const c8=$('#c8').getContext('2d',{willReadFrequently:true});c8.drawImage(v,x,y,s,s,0,0,8,8);
 const e=c8.getImageData(0,0,8,8).data,g=[];for(let i=0;i<e.length;i+=4)g.push(.3*e[i]+.59*e[i+1]+.11*e[i+2]);
 const m=g.reduce((a,b)=>a+b)/64,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/64)||1;
 return H.concat(g.map(z=>(z-m)/sd)).map(z=>+z.toFixed(3))}
function dist(a,b){let h=0,g=0;for(let i=0;i<64;i++)h+=Math.abs(a[i]-b[i]);for(let i=64;i<128;i++)g+=(a[i]-b[i])**2;return h+Math.sqrt(g/64)*.35}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#vd').srcObject=stream;return true}catch(e){$('#cerr').innerHTML='<div class="l" style="margin-top:10px">تعذر فتح الكاميرا. اسمح بالصلاحية، وتأكد أن الرابط يبدأ بـ https.</div>';return false}}
function stopLoop(){clearInterval(loop);loop=null}
function stopCam(){stopLoop();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function startLoop(){stopLoop();loop=setInterval(scan,1000)}
async function openScan(){sheet(`<h3>تعرّف على المنتج</h3><p class="mu" style="margin:0 0 10px">ضع المنتج داخل الإطار في مكان مضيّ، والنتائج تظهر تلقائياً.</p><div class="vw"><video id="vd" autoplay playsinline muted></video></div><div id="cerr"></div><div id="res"></div><button class="btn ghost w" style="margin-top:12px" onclick="closeSheet()">إغلاق</button>`);
 if(await startCam())startLoop()}
function scan(){const v=$('#vd');if(!v||!v.videoWidth||!D.products.length){if($('#res')&&!D.products.length)$('#res').innerHTML='<div class="mu" style="margin-top:10px">سجّل منتجات أولاً من تبويب المنتجات.</div>';return}
 const s=sig(v),r=D.products.map(p=>({p,d:Math.min(...p.sigs.map(x=>dist(x,s)))})).sort((a,b)=>a.d-b.d).slice(0,3);
 $('#res').innerHTML=r.map(x=>`<button class="chip" onclick="add('${x.p.id}')"><b>${esc(x.p.name)}</b><span><em>تشابه ${Math.max(0,Math.min(99,Math.round(100-x.d*60)))}%</em> &nbsp;<b class="num">${n2(x.p.price)}</b></span></button>`).join('')}
async function openAdd(id){const p=id?find(id):null;frames=[];
 sheet(`<h3>${p?'تعديل المنتج':'منتج جديد'}</h3>
 <div class="vw"><video id="vd" autoplay playsinline muted></video></div><div id="cerr"></div><div class="prog"><i id="pg"></i></div>
 <p class="mu" id="pt" style="margin:6px 0 0">اختر مكان فيه إضاءة، واضغط تصوير ثم قلّب المنتج من كل الجهات.</p>
 <label>اسم المنتج</label><input id="pn" value="${p?esc(p.name):''}">
 <div class="row"><div><label>سعر البيع</label><input id="pp" type="number" inputmode="decimal" value="${p?p.price:''}"></div><div><label>رأس المال</label><input id="pc" type="number" inputmode="decimal" value="${p?p.cost:''}"></div><div><label>الكمية</label><input id="pq" type="number" inputmode="numeric" value="${p?p.qty:''}"></div></div>
 <div class="row" style="margin-top:14px"><button class="btn w" id="go" onclick="record()">📸 تصوير</button><button class="btn ghost w" onclick="saveProd('${id||''}')">${p?'حفظ بدون تصوير':'إلغاء'}</button></div>`);
 window.editId=id||'';if(!p)$('#sb .btn.ghost').onclick=closeSheet;await startCam()}
function record(){const v=$('#vd');if(!v||!v.videoWidth){toast('الكاميرا غير جاهزة');return}
 if(!$('#pn').value.trim()){toast('اكتب اسم المنتج أولاً');$('#pn').focus();return}
 frames=[];const N=14;$('#go').disabled=true;
 const t=setInterval(()=>{frames.push(sig(v));$('#pg').style.width=frames.length/N*100+'%';$('#pt').textContent='قلّب المنتج ببطء… '+frames.length+'/'+N;
 if(frames.length>=N){clearInterval(t);saveProd(editId,true)}},550)}
function saveProd(id,withFrames){const name=$('#pn').value.trim();if(!name){toast('اكتب اسم المنتج');return}
 const f={name,price:+$('#pp').value||0,cost:+$('#pc').value||0,qty:+$('#pq').value||0};
 if(id){const p=find(id);Object.assign(p,f);if(withFrames)p.sigs=p.sigs.concat(frames).slice(-42)}else D.products.push(Object.assign({id:uid(),sigs:frames},f));
 save();closeSheet();toast('تم حفظ '+name);render()}
/* ===== الأرباح ===== */
function rep(){const now=new Date(),inM=t=>{const d=new Date(t);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()};
 const sum=(a,k)=>a.reduce((x,y)=>x+y[k],0),sm=D.sales.filter(s=>inM(s.t)),em=D.exp.filter(e=>inM(e.t));
 const ex=sum(em,'amt'),gm=sum(sm,'total')-sum(sm,'cost'),net=gm-ex;
 const stockV=D.products.reduce((s,p)=>s+p.cost*p.qty,0),debtV=D.debts.reduce((s,d)=>s+d.amt-d.paid,0);
 const K=(k,v,c='')=>`<div class="card"><div class="mu">${k}</div><b class="num ${c}">${n2(v)}</b></div>`;
 $('#m').innerHTML=`<div class="hero"><small>${net>=0?'صافي ربح هذا الشهر':'خسارة هذا الشهر'}</small><b class="num" style="color:${net>=0?'#7ee2a8':'#ff9b9b'}">${n2(Math.abs(net))}</b><small>بعد خصم المصاريف والإيجار</small></div>
 <div class="kg">${K('مبيعات الشهر',sum(sm,'total'))}${K('ربح المبيعات',gm,'g')}${K('مصاريف الشهر',ex,'l')}${K('ديون على الناس',debtV,'l')}${K('قيمة البضاعة بالمخزن',stockV)}${K('رأس المال + الأرباح',D.capital+net)}</div>
 <h2>رأس المال</h2><div class="card"><div class="row"><input id="cp" type="number" inputmode="decimal" value="${D.capital||''}" placeholder="رأس المال المدخل"><button class="btn" style="flex:none" onclick="D.capital=+$('#cp').value||0;save();toast('تم الحفظ');rep()">حفظ</button></div></div>
 <h2>نسخة احتياطية</h2><div class="card"><p class="mu" style="margin-top:0">بياناتك محفوظة في هذا المتصفح فقط. حمّل نسخة بين فترة وفترة، أو لما تغيّر الجوال أو الرابط.</p><div class="row"><button class="btn ghost" onclick="bk()">تحميل نسخة</button><button class="btn ghost" onclick="$('#fi').click()">استرجاع نسخة</button></div><input id="fi" type="file" accept=".json" hidden onchange="rs(this.files[0])"></div>`}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='kasher-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{D=Object.assign({products:[],sales:[],exp:[],debts:[],capital:0},JSON.parse(r.result));save();toast('تم الاسترجاع');render()}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
/* ===== الديون ===== */
function debt(){const o=D.debts.filter(d=>d.amt>d.paid);
 $('#m').innerHTML=(o.length?`<div class="hero"><small>إجمالي الديون على الناس</small><b class="num">${n2(o.reduce((s,d)=>s+d.amt-d.paid,0))}</b></div>`:'')+(o.map(d=>`<div class="card"><div class="row sb"><b>${esc(d.name)}</b><b class="num l" style="flex:none">${n2(d.amt-d.paid)}</b></div><div class="mu">${new Date(d.t).toLocaleDateString('ar')}${d.paid?' · مسدّد منه '+n2(d.paid):''}</div><button class="btn sm" style="margin-top:10px" onclick="settle('${d.id}')">تسديد</button></div>`).join('')||`<div class="empty"><svg viewBox="0 0 24 24">${I.debt}</svg><div>ما فيه ديون حالياً</div></div>`)}
function settle(id){const d=D.debts.find(x=>x.id==id);ask('تسديد دين '+esc(d.name),'المبلغ المسدّد',d.amt-d.paid,a=>{if(a>0){d.paid=Math.min(d.amt,d.paid+a);save();toast('تم التسديد');debt()}})}
/* ===== المصاريف ===== */
function exp(){
 $('#m').innerHTML=`<div class="card"><label style="margin-top:0">نوع المصروف</label><select id="et"><option>إيجار المحل</option><option>بضاعة</option><option>رواتب</option><option>كهرباء وماء</option><option>أخرى</option></select><label>المبلغ</label><input id="ea" type="number" inputmode="decimal"><button class="btn w" style="margin-top:12px" onclick="addE()">إضافة مصروف</button></div>
 <h2>السجل</h2>${D.exp.slice().reverse().map(e=>`<div class="card row sb" style="padding:10px 14px"><span>${e.type}<br><span class="mu">${new Date(e.t).toLocaleDateString('ar')}</span></span><b class="num l" style="flex:none">${n2(e.amt)}</b></div>`).join('')||'<div class="mu" style="margin:0 4px">لا يوجد مصاريف مسجلة</div>'}`}
function addE(){const a=+$('#ea').value;if(a>0){D.exp.push({t:Date.now(),type:$('#et').value,amt:a});save();toast('تمت الإضافة');exp()}else toast('اكتب المبلغ')}
/* ===== الاختصارات ===== */
addEventListener('keydown',e=>{const k=e.key,inp=['INPUT','SELECT'].includes(document.activeElement.tagName);
 if(k=='F2'||(k=='/'&&!inp)){e.preventDefault();closeSheet();tab='pos';render();$('#s').focus()}
 else if(k=='F4'){e.preventDefault();closeSheet();tab='pos';render();openScan()}
 else if(k=='F9'){e.preventDefault();pay(0)}else if(k=='F8'){e.preventDefault();pay(1)}
 else if(k=='Escape')closeSheet()});
render();
</script></body></html>
