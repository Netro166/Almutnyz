<style>
:root{--bg:#eef3f1;--sf:#fff;--ink:#0c2f2c;--mu:#5f7774;--ln:#d9e4e1;--pr:#0f5c55;--on:#fff;--bar:#0c3b37;--ac:#e3a008;--rd:#c93c3c;--gr:#14804a;--soft:#e4eeec;--c-cash:#14804a;--c-card:#2d6fd6;--c-exch:#8a4fd0;--c-debt:#c93c3c}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}

.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:720px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--bar);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:22px}

main{max-width:720px;margin:auto;padding:8px 14px 190px}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:18px 4px 8px}
.srch{display:flex;gap:8px;position:relative}

.empty{padding:34px 10px;text-align:center;color:var(--mu)}

.btn.ac{background:var(--ac);color:#2b1d00}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.rd{background:var(--rd);color:#fff}.btn.sm{height:38px;padding:0 12px;font-size:14px}.btn.w{width:100%}

.pl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pl span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12.5px}

.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.kg .card{margin:0}.kg b{font-size:21px;display:block}
label{display:block;font-size:13px;color:var(--mu);margin:10px 2px 4px}
input,select{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);padding:0 12px}

.chk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}

.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}

.bars.wk{height:150px}
.tb{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-top:10px}

.tr{border-top:1px solid var(--ln);font-size:15px}
.tr small{display:block;color:var(--mu);font-size:12px}
.tr.best{background:#e3a00822}
.tr .st{color:var(--ac);margin-inline-start:4px}
.tr.ft{background:var(--soft);font-weight:700}
.tg{display:inline-block;border-radius:7px;padding:0 8px;font-size:12px;color:#fff;background:var(--c)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:70;transition:transform .25s;font-weight:600;max-width:90%}
#toast.on{transform:translate(-50%,0)}
kbd{background:var(--soft);border-radius:5px;padding:1px 6px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){#pb .tt b{font-size:22px}.btn{padding:0 12px}#pb .btn{padding:0 20px}.tr{font-size:14px;padding:10px 8px}.th{padding:10px 8px}}
#au{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;overflow:auto;padding:20px}
.ab{width:min(420px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px}
.hd{display:flex;align-items:center;gap:12px}
.mb{position:relative;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);display:grid;place-items:center;padding:0}
.mb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.mb i{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--gr)}
.mb i.pending{background:var(--ac)}.mb i.offline,.mb i.err{background:var(--rd)}
body.st nav{display:none}body.st #pb{bottom:calc(12px + env(safe-area-inset-bottom))}body.st main{padding-bottom:130px}
#sh.top{z-index:80}
.ib{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);color:var(--mu);font:italic 700 17px Georgia,serif;display:grid;place-items:center;padding:0;flex:none}
.al{display:block;margin:14px auto 0;background:none;border:0;color:var(--mu);font-size:12.5px;padding:6px 10px}
.ibi{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;font:italic 700 11px Georgia,serif;vertical-align:middle}
details.card summary::marker{color:var(--pr)}
</style></head><body>

 D.sales.forEach(s=>{if(!s.id)s.id=uid();if(!s.m)s.m=s.debt?'debt':'cash'});
 D.exp.forEach(e=>{if(!e.id)e.id=uid()});D.debts.forEach(d=>{if(!d.id)d.id=uid()});

/* ===== محرك التعرف على المنتج (يعمل على الجهاز بدون إنترنت) =====
   البصمة = توزيع ألوان HSV على شبكة 3×3 + توزيع عام + اتجاهات الحواف (HOG) + طاقة الحواف.
   المطابقة = أقرب 3 لقطات + متوسط عدة إطارات متتالية + هامش فصل بين أول نتيجتين. */

function featPix(d){const N=S*S,lh=new Uint16Array(256);

 for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=(y*S+x)*4;
  const r=Math.min(255,d[i]*gain),gg=Math.min(255,d[i+1]*gain),b=Math.min(255,d[i+2]*gain);
  g[y*S+x]=.299*r+.587*gg+.114*b;

  if(s<.2||v<.18){b0=12+(v<.25?0:v<.5?1:v<.78?2:3)}
  else{let h;const df=mx-mn;if(mx==r)h=((gg-b)/df+6)%6;else if(mx==gg)h=(b-r)/df+2;else h=(r-gg)/df+4;
   b0=Math.floor(h*2)%12;w1=h*2-Math.floor(h*2);b1=(b0+1)%12}
  hc[cell*16+b0]+=1-w1;if(b1>=0)hc[cell*16+b1]+=w1;
  hc[144+b0]+=1-w1;if(b1>=0)hc[144+b1]+=w1}

 for(let k=0;k<10;k++){let t=0;for(let j=0;j<16;j++)t+=hc[k*16+j];t=t||1;for(let j=0;j<16;j++)out[k*16+j]=Math.sqrt(hc[k*16+j]/t)}

 for(let y=1;y<S-1;y++)for(let x=1;x<S-1;x++){const gx=g[y*S+x+1]-g[y*S+x-1],gy=g[(y+1)*S+x]-g[(y-1)*S+x],m=Math.hypot(gx,gy);if(m<1)continue;

function dist(a,b){let cs=0,gs=0,hs=0,es=0,x;

function cashFrom(p){const n=Date.now();if(p=='day')return startDay(n);if(p=='week')return startDay(n-6*864e5);if(p=='month'){const d=new Date(n);return new Date(d.getFullYear(),d.getMonth(),1).getTime()}return 0}
function cashCalc(from){const sc=D.sales.filter(s=>s.t>=from),sum=a=>a.reduce((x,y)=>x+y.amt,0);
 const sal=sc.filter(s=>s.m=='cash').reduce((a,s)=>a+s.total,0),oth=sc.filter(s=>s.m=='card'||s.m=='exch').reduce((a,s)=>a+s.total,0);
 const mv=D.cash.filter(x=>x.t>=from),sett=sum(mv.filter(x=>x.type=='in'&&x.src=='debt')),dep=sum(mv.filter(x=>x.type=='in'&&x.src!='debt')),out=sum(mv.filter(x=>x.type=='out'));
 return{sal,oth,sett,dep,out,net:sal+sett+dep-out,mv}}
const cashBal=()=>cashCalc(0).net;
function cash(){const bal=cashBal(),c=cashCalc(cashFrom(CP));
 const seg=`<div class="seg">${[['day','اليوم'],['week','الأسبوع'],['month','الشهر'],['all','كل الأوقات']].map(a=>`<button class="${CP==a[0]?'on':''}" onclick="CP='${a[0]}';cash()">${a[1]}</button>`).join('')}</div>`;
 const row=(k,v,cl='')=>`<div class="row sb" style="padding:6px 0"><span>${k}</span><b class="num ${cl}" style="flex:none">${n2(v)}</b></div>`;
 $('#m').innerHTML=`<div class="hero"><small>الموجود في الصندوق الآن (كل الأوقات)</small><b class="num" style="color:${bal>=0?'#7ee2a8':'#ff9b9b'}">${n2(bal)}</b><small>مبيعات الكاش + تسديد الديون + الإيداعات − السحوبات</small></div>
 <div class="row" style="margin-top:10px"><button class="btn rd" onclick="cashMove('out')">− سحب من الصندوق</button><button class="btn ghost" onclick="cashMove('in')">+ إيداع</button></div>
 ${seg}<div class="card"><div class="row sb"><b>حركة ${({day:'اليوم',week:'آخر 7 أيام',month:'هذا الشهر',all:'كل الأوقات'})[CP]}</b><b class="num ${c.net<0?'l':'g'}" style="flex:none;font-size:22px">${n2(c.net)}</b></div>
 ${row('مبيعات كاش',c.sal)}${row('تسديد ديون',c.sett)}${row('إيداعات',c.dep)}${row('سحوبات',c.out,'l')}
 <div class="mu" style="margin-top:6px;padding-top:8px;border-top:1px dashed var(--ln)">مبيعات الشبكة والصرافة في هذه الفترة: <b class="num">${n2(c.oth)}</b> (ليست في الدرج)</div></div>
 <h2>سجل حركات الصندوق</h2>${c.mv.slice().sort((a,b)=>b.t-a.t).map(x=>`<div class="card" style="padding:10px 12px"><div class="row sb"><span class="tg" style="--c:var(--c-${x.type=='out'?'debt':'cash'});flex:none">${x.type=='out'?'سحب':x.src=='debt'?'تسديد دين':'إيداع'}</span><b class="num ${x.type=='out'?'l':'g'}" style="text-align:left">${x.type=='out'?'−':'+'}${n2(x.amt)}</b></div><div style="margin-top:4px">${esc(x.reason||'')}</div><div class="mu">${fmtDay(dk(x.t))} · ${hm(x.t)}${x.by?' · '+esc(x.by):''}</div></div>`).join('')||'<div class="mu" style="margin:0 4px">لا توجد سحوبات أو إيداعات في هذه الفترة</div>'}`}
function cashMove(type){const out=type=='out';
 sheet(`<h3>${out?'سحب من الصندوق':'إيداع في الصندوق'}</h3><p class="mu" style="margin:0">الموجود الآن: <b class="num">${n2(cashBal())}</b></p>
 <label>المبلغ</label><input id="cm" type="number" inputmode="decimal"><label>السبب (إلزامي)</label><input id="cr" placeholder="${out?'مثال: شراء بضاعة / سلفة / مصروف':'مثال: رصيد افتتاحي'}">
 <div id="ce" class="l" style="min-height:24px;margin-top:4px"></div><div class="row"><button class="btn ${out?'rd':''} w" id="cgo">${out?'تأكيد السحب':'تأكيد الإيداع'}</button><button class="btn ghost w" onclick="closeSheet()">إلغاء</button></div>`);
 $('#cm').focus();
 $('#cgo').onclick=()=>{const a=+$('#cm').value,r=$('#cr').value.trim(),e=m=>{$('#ce').textContent=m};
  if(!(a>0))return e('اكتب المبلغ');if(r.length<3)return e('اكتب سبب واضح (3 أحرف على الأقل)');
  if(out&&a>cashBal()+1e-9)return e('المبلغ أكبر من الموجود في الصندوق ('+n2(cashBal())+')');
  D.cash.push({id:uid(),t:Date.now(),type,amt:a,reason:r,src:'manual',by:isOwner()?'':ME.name});save();closeSheet();toast((out?'تم سحب ':'تم إيداع ')+n2(a));cash()}}
/* ===== الرواتب (للمالك) ===== */
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let PRM=0;
const prMonth=off=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const mLabel=mk=>{const a=mk.split('-');return MN[+a[1]-1]+' '+a[0]};
function prCalc(s,mk){const sal=+s.salary||0,daily=sal/30,ab=(s.abs||[]).filter(a=>a.k.slice(0,7)==mk),ded=Math.min(sal,ab.length*daily),net=sal-ded,paid=(s.pays||[]).filter(x=>x.mk==mk).reduce((a,x)=>a+x.amt,0);
 return{sal,daily,n:ab.length,ded,net,paid,rem:net-paid,ab}}
function payroll(){const mk=prMonth(PRM),rows=D.staff.map(s=>({s,c:prCalc(s,mk)})),T=k=>rows.reduce((a,r)=>a+r.c[k],0),due=rows.reduce((a,r)=>a+Math.max(0,r.c.rem),0);
 $('#m').innerHTML=`<div class="row" style="margin-top:8px"><button class="btn ghost sm" style="flex:none;width:46px" onclick="PRM--;payroll()" aria-label="الشهر السابق">›</button><b style="text-align:center">${mLabel(mk)}</b><button class="btn ghost sm" style="flex:none;width:46px" ${PRM>=0?'disabled':''} onclick="PRM++;payroll()" aria-label="الشهر التالي">‹</button></div>
 <div class="hero"><small>المتبقي من رواتب ${mLabel(mk)}</small><b class="num">${n2(due)}</b><small>بعد خصم أيام الغياب وما صُرف</small></div>
 <div class="kg"><div class="card"><div class="mu">إجمالي الرواتب</div><b class="num">${n2(T('sal'))}</b></div><div class="card"><div class="mu">خصم الغياب</div><b class="num l">${n2(T('ded'))}</b></div><div class="card"><div class="mu">صافي بعد الخصم</div><b class="num">${n2(T('net'))}</b></div><div class="card"><div class="mu">المصروف</div><b class="num g">${n2(T('paid'))}</b></div></div>
 <h2>الموظفون</h2>${rows.map(({s,c})=>`<div class="card"><div class="row sb"><b>${esc(s.name)}</b><span class="mu" style="flex:none">الراتب <b class="num">${n2(c.sal)}</b></span></div>
 ${c.sal?`<div class="pl"><span>يوميته (÷30) <b class="num">${n2(c.daily)}</b></span><span>أيام الغياب <b class="num ${c.n?'l':''}">${c.n}</b></span><span>الخصم <b class="num l">${n2(c.ded)}</b></span></div>
 <div class="row sb" style="padding:8px 0 0"><span>صافي الراتب</span><b class="num" style="flex:none">${n2(c.net)}</b></div><div class="row sb"><span>المصروف</span><b class="num g" style="flex:none">${n2(c.paid)}</b></div>
 <div class="chg"><span>${c.rem<0?'صُرف زيادة':'المتبقي له'}</span><b class="num ${c.rem<0?'l':''}">${n2(Math.abs(c.rem))}</b></div>`:'<p class="mu" style="margin:8px 0 0">حدّد راتبه الشهري ليبدأ احتساب اليومية والخصم.</p>'}
 <div class="row" style="margin-top:10px">${c.sal?`<button class="btn ghost sm l" onclick="absSheet('${s.id}')">غياب</button><button class="btn sm" onclick="paySal('${s.id}')">صرف</button>`:''}<button class="btn ghost sm" onclick="prSalary('${s.id}')">الراتب</button>${c.sal?`<button class="btn ghost sm" onclick="prLog('${s.id}')">السجل</button>`:''}</div></div>`).join('')||'<div class="empty"><svg viewBox="0 0 24 24">'+I.payroll+'</svg><div>أضف موظفين أولاً من تبويب الموظفين</div></div>'}
 <p class="mu" style="margin:10px 4px">الخصم عن كل يوم غياب = الراتب الشهري ÷ 30، بغض النظر عن عدد أيام الشهر.</p>`}
function prSalary(id){const s=D.staff.find(x=>x.id==id);ask('الراتب الشهري لـ '+esc(s.name),'المبلغ',s.salary||'',v=>{if(v>=0){s.salary=v;save();toast('تم حفظ الراتب');payroll()}})}
function absSheet(id){const s=D.staff.find(x=>x.id==id),mk=prMonth(PRM),c=prCalc(s,mk);if(!c.sal){toast('حدد راتب الموظف أولاً');return}
 sheet(`<h3>تسجيل غياب · ${esc(s.name)}</h3><p class="mu" style="margin:0">اليومية = ${n2(c.sal)} ÷ 30 = <b class="num">${n2(c.daily)}</b> وتُخصم عن كل يوم غياب.</p>
 <label>تاريخ الغياب</label><input id="ad" type="date" value="${PRM==0?dk(Date.now()):mk+'-01'}"><label>ملاحظة (اختياري)</label><input id="an" placeholder="مثال: بدون عذر">
 <div id="ae" class="l" style="min-height:22px;margin-top:4px"></div><div class="row"><button class="btn rd w" id="ags">تسجيل وخصم ${n2(c.daily)}</button><button class="btn ghost w" onclick="closeSheet()">إلغاء</button></div>`);
 $('#ags').onclick=()=>{const k=$('#ad').value,e=m=>{$('#ae').textContent=m};if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return e('اختر التاريخ');if(k>dk(Date.now()))return e('لا يمكن تسجيل غياب في المستقبل');
  s.abs=s.abs||[];if(s.abs.some(a=>a.k==k))return e('هذا اليوم مسجل غياب مسبقاً');
  s.abs.push({id:uid(),k,note:$('#an').value.trim(),t:Date.now()});save();closeSheet();toast(k.slice(0,7)==mk?'تم تسجيل الغياب':'سُجّل في شهر '+mLabel(k.slice(0,7)));payroll()}}
function paySal(id){const s=D.staff.find(x=>x.id==id),mk=prMonth(PRM),c=prCalc(s,mk);
 sheet(`<h3>صرف · ${esc(s.name)}</h3><p class="mu" style="margin:0">راتب ${mLabel(mk)} · المتبقي <b class="num">${n2(c.rem)}</b></p>
 <label>النوع</label><select id="py"><option value="sal">دفعة من الراتب</option><option value="adv">سلفة</option></select>
 <label>المبلغ</label><input id="pa" type="number" inputmode="decimal" value="${c.rem>0?Math.round(c.rem*100)/100:''}"><label>ملاحظة (اختياري)</label><input id="pn2">
 <div class="chk"><input type="checkbox" id="pcx"><label for="pcx">يُسحب من صندوق الأموال (الموجود الآن ${n2(cashBal())})</label></div>
 <div id="pe2" class="l" style="min-height:22px;margin-top:4px"></div><div class="row"><button class="btn w" id="pgo">تأكيد الصرف</button><button class="btn ghost w" onclick="closeSheet()">إلغاء</button></div>`);
 $('#pgo').onclick=()=>{const a=+$('#pa').value,ty=$('#py').value,note=$('#pn2').value.trim(),fc=$('#pcx').checked,e=m=>{$('#pe2').textContent=m};
  if(!(a>0))return e('اكتب المبلغ');if(ty=='sal'&&a>c.rem+.001)return e('المبلغ أكبر من المتبقي. اختر «سلفة» لو تبغى تدفع زيادة');
  if(fc&&a>cashBal()+1e-9)return e('المبلغ أكبر من الموجود في الصندوق');
  const py={id:uid(),t:Date.now(),amt:a,mk,type:ty,note};
  if(fc){const m={id:uid(),t:Date.now(),type:'out',amt:a,reason:(ty=='adv'?'سلفة موظف: ':'راتب موظف: ')+s.name+(note?' — '+note:''),src:'manual',by:''};D.cash.push(m);py.cid=m.id}
  s.pays=s.pays||[];s.pays.push(py);save();closeSheet();toast('تم صرف '+n2(a)+' لـ '+s.name);payroll()}}
function prLog(id){const s=D.staff.find(x=>x.id==id),mk=prMonth(PRM),c=prCalc(s,mk),pays=(s.pays||[]).filter(x=>x.mk==mk).sort((a,b)=>b.t-a.t);
 sheet(`<h3>سجل ${esc(s.name)} · ${mLabel(mk)}</h3><h2 style="margin-top:10px">أيام الغياب (${c.n})</h2>
 ${c.ab.slice().sort((a,b)=>a.k<b.k?1:-1).map(a=>`<div class="card row sb" style="padding:8px 12px"><span>${dayName(a.k)} ${fmtDay(a.k)}${a.note?'<br><span class="mu">'+esc(a.note)+'</span>':''}</span><span class="l num" style="flex:none">−${n2(c.daily)}</span><button class="btn ghost sm l" style="flex:none" onclick="delAbs('${s.id}','${a.id}')">حذف</button></div>`).join('')||'<div class="mu">لا يوجد غياب</div>'}
 <h2>المصروف</h2>${pays.map(x=>`<div class="card row sb" style="padding:8px 12px"><span>${x.type=='adv'?'سلفة':'راتب'} · ${fmtDay(dk(x.t))}${x.note?'<br><span class="mu">'+esc(x.note)+'</span>':''}${x.cid?'<br><span class="mu">من الصندوق</span>':''}</span><b class="num g" style="flex:none">${n2(x.amt)}</b>${x.cid?'':`<button class="btn ghost sm l" style="flex:none" onclick="delPay('${s.id}','${x.id}')">حذف</button>`}</div>`).join('')||'<div class="mu">لا يوجد مصروف</div>'}
 <button class="btn ghost w" style="margin-top:14px" onclick="closeSheet()">إغلاق</button>`)}
function delAbs(sid,aid){const s=D.staff.find(x=>x.id==sid);s.abs=(s.abs||[]).filter(a=>a.id!=aid);save();payroll();prLog(sid)}

function about(){sheet(`<div style="text-align:center"><div class="logo" style="margin:0 auto 6px;width:50px;height:50px;font-size:28px">م</div><h3 style="margin:0">كاشير المتميز</h3><div class="mu">الإصدار 1.0 · نبذة وحقوق الملكية</div></div>
 <div class="card" style="line-height:1.9"><b>عن الموقع</b><p style="margin:6px 0 0">كاشير المتميز نظام بسيط وسريع لإدارة المحل: بيع بالكاش والشبكة والصرافة والدين، تعرّف على المنتجات بالكاميرا، مخزون وأرباح يومية، صندوق أموال، وموظفون بصلاحيات ورواتب. صُنع ليخدم صاحب المحل بلا تعقيد ولا اشتراكات.</p></div>

 <p style="margin:8px 0 0"><b>ليث عمر محمد سلمان الشراري</b></p><a class="btn w" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:10px;background:#25a244;color:#fff" href="https://wa.me/966575561482" target="_blank" rel="noopener">تواصل واتساب · <span class="num">0575561482</span></a></div>
